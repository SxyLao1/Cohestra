name: Tag Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src/cohestra
      - run: python -m pytest --cov=cohestra --cov-report=term-missing --cov-fail-under=65
      - run: python scripts/check_project.py
      - run: python scripts/check_sensitive_data.py
      - run: python -m build
      - run: python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: cohestra-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
