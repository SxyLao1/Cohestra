name: Feature request
description: Propose an auditable, bounded improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and operational impact
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed boundary
      description: Include state, adapter, platform, and security implications.
    validations:
      required: true
