name: Bug report
description: Report a reproducible Cohestra defect without sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, session IDs, live databases, personal memory, or private machine routes.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use sanitized data and explicit temporary paths.
    validations:
      required: true
