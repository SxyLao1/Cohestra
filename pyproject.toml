[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cohestra"
version = "0.1.0"
description = "Local-first, auditable coordination for heterogeneous AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cohestra contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
cohestra = "cohestra.cli:main"
cohestra-bridge = "cohestra.bridge.cli:main"

[project.urls]
Documentation = "https://github.com/SxyLao1/Cohestra#readme"
Issues = "https://github.com/SxyLao1/Cohestra/issues"
Source = "https://github.com/SxyLao1/Cohestra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "architecture: package and dependency boundary checks",
  "integration: multi-component tests using temporary local resources",
]

[tool.coverage.run]
branch = true
source = ["cohestra"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cohestra"]
